name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  deploy-frontend:
    name: Deploy Frontend to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies (Frontend)
        working-directory: frontend
        run: npm ci --no-fund

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: gap-analyzer-frontend
          directory: frontend/dist
          branch: ${{ github.ref_name }}

  deploy-worker:
    name: Deploy Worker to Cloudflare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'worker/package-lock.json'

      - name: Install dependencies (Worker)
        working-directory: worker
        run: npm ci --no-fund

      - name: Deploy Worker to Cloudflare
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
          --name gap-analyzer-worker
          --var TWELVEDATA_API_KEY:${{ secrets.TWELVEDATA_API_KEY }}
          --var ANTHROPIC_API_KEY:${{ secrets.ANTHROPIC_API_KEY }}
          --var OPENAI_API_KEY:${{ secrets.OPENAI_API_KEY }}
          --var APP_USERNAME:${{ secrets.APP_USERNAME }}
          --var APP_PASSWORD:${{ secrets.APP_PASSWORD }}
          --var TICKERS:${{ secrets.TICKERS }}

  lint-and-test:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-fund

      - name: Run linter
        working-directory: frontend
        run: npm run lint
        continue-on-error: true

      - name: Type check
        working-directory: frontend
        run: npx tsc -b
